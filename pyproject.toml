[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-quality"
version = "0.1.0"
description = "Quality module for the SLIM LIMS ecosystem: QC control charts, trend and forecast tools, change control"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "coverage[toml]>=7.5",
    "ruff==0.16.9",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
include = ["slim_quality*"]

[tool.setuptools.package-data]
slim_quality = ["persistence/alembic.ini", "persistence/migrations/**/*", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["slim_quality"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"slim_quality/service/svg.py" = ["E501"]  # SVG markup reads better on one line per element
